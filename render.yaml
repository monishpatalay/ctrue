# Render Blueprint for the Ctrue API. Deploy with Render → New → Blueprint → this repository.
# Secret values (sync: false) are entered in Render's form, never committed here.
services:
  - type: web
    name: ctrue-api
    runtime: node
    plan: starter            # the free plan sleeps after 15 idle minutes, which drops live audio connections
    region: oregon
    branch: main
    buildCommand: npm ci --workspace=@ctrue/api && npm run build -w @ctrue/api
    startCommand: npm start -w @ctrue/api
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:             # redeploy (and restart, cutting off answers in progress) only when the API changes
      paths:
        - apps/api/**
        - package.json
        - package-lock.json
        - render.yaml
    numInstances: 1          # sign-in handoff codes live in memory; more than one copy would break them
    domains:
      - api.ctrue.monishpatalay.dev
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: development    # production refuses to start without the Neon and OpenAI settings
      - key: DEMO_MODE
        value: "false"
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOWED_ORIGINS
        value: https://ctrue.monishpatalay.dev
      - key: WEB_URL
        value: https://ctrue.monishpatalay.dev
      - key: NEON_AUTH_BASE_URL
        value: https://ep-calm-moon-b5v7zn9p.neonauth.c-7.us-east-2.aws.neon.tech/neondb/auth
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: AUDIO_SILENCE_MS
        value: "600"
      - key: TRIAL_SECONDS
        value: "600"
      - key: METERING
        value: "false"          # free app: every user brings their own OpenAI key
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
